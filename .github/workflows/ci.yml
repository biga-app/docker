name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch upstream image or source breakage

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scripts
        run: shellcheck --shell=sh scripts/*.sh

      - name: Compose files, every combination
        run: |
          ./scripts/setup.sh --mode public --domain biga.example.com --yes
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.ipv6.yaml config --quiet
          docker compose -f compose.yaml -f compose.scale.yaml config --quiet
          docker compose -f compose.yaml -f compose.ipv6.yaml -f compose.scale.yaml config --quiet
          docker compose -f compose.yaml -f compose.s3.yaml config --quiet
          docker compose -f compose.yaml -f compose.ipv6.yaml -f compose.scale.yaml -f compose.s3.yaml config --quiet

      - name: Caddyfiles, every mode
        run: |
          for mode in public internal http; do
            for domain in biga.example.com 192.0.2.10 '[2001:db8::10]'; do
              docker run --rm -e BIGA_DOMAIN="$domain" -e BIGA_UPSTREAM_PROXIES=127.0.0.1/32 \
                -v "$PWD/caddy:/etc/caddy:ro" caddy:2-alpine \
                caddy validate --config "/etc/caddy/$mode.Caddyfile" --adapter caddyfile
            done
          done

  smoke:
    name: Smoke test (${{ matrix.overrides || 'default' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        overrides: ["", "-f compose.ipv6.yaml -f compose.scale.yaml", "-f compose.s3.yaml"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: biga-app/server
          path: src/server
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: biga-app/website
          path: src/website
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: biga-app/cli
          path: src/cli
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Start the stack
        env:
          OVERRIDES: ${{ matrix.overrides }}
        run: |
          ./scripts/setup.sh --mode http --domain localhost --http-port 8080 --yes
          sed -i 's#^BIGA_PUBLIC_URL=.*#BIGA_PUBLIC_URL=http://localhost:8080#' .env
          printf 'BIGA_SERVER_SOURCE=./src/server\nBIGA_WEB_SOURCE=./src/website\n' >> .env
          # shellcheck disable=SC2086 # OVERRIDES is a list of flags
          docker compose -f compose.yaml $OVERRIDES up -d --build --wait --wait-timeout 300

      - name: Build the CLI
        run: go build -C src/cli -o "$PWD/biga" ./cmd/biga

      - name: Broadcast through it
        run: |
          set -eu
          key=$(grep '^BIGA_ACCESS_KEYS=' .env | cut -d= -f2)
          url=http://localhost:8080
          curl -fsS -o /dev/null "$url/"

          # No key, no session.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: application/x-protobuf' -H 'Accept: application/x-protobuf' "$url/api/sessions/smoke1")" = 401

          project=$(mktemp -d)
          printf 'hello\n' > "$project/a.txt"
          BIGA_API_URL=$url BIGA_ACCESS_KEY=$key BIGA_HOME=$(mktemp -d) BIGA_NO_UPDATE_CHECK=1 \
            ./biga start --session smoke1 "$project" >"$RUNNER_TEMP/cli.log" 2>&1 &
          cli=$!
          for _ in $(seq 1 60); do
            grep -q 'Started' "$RUNNER_TEMP/cli.log" && break
            sleep 0.5
          done
          cat "$RUNNER_TEMP/cli.log"
          grep -q 'Started' "$RUNNER_TEMP/cli.log"

          printf 'edited\n' >> "$project/a.txt"
          sleep 3

          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/x-protobuf' "$url/api/sessions/smoke1/state")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/x-protobuf' "$url/api/sessions/smoke1/file?path=a.txt")" = 200
          curl -fsS -o /dev/null "$url/session/smoke1"
          kill "$cli"

      - name: Logs
        if: failure()
        run: docker compose logs
